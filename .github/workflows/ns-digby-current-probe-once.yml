name: One-time verify Digby County current-profile public source fields
on:
  push:
    branches: ['research/rm2-raw-six-trials-20261020']
    paths: ['.github/workflows/ns-digby-current-probe-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe four named verified ADCP deployments with 3 rows each
        run: python scripts/probe_ns_digby_current.py --probe
