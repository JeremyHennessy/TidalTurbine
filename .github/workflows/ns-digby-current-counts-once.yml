name: One-time Digby public ADCP profile coverage count
on:
  push:
    branches: ['research/rm2-raw-six-trials-20261020']
    paths: ['.github/workflows/ns-digby-current-counts-once.yml']
permissions:
  contents: read
jobs:
  counts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Count Grand Passage, Petit Passage and Westport publicly observed ADCP depth rows
        run: python scripts/probe_ns_digby_counts.py --counts
