name: One-shot public native-QC access and Digby sample probe
on:
  push:
    branches:
      - research/force-native-qc-independent-20261020
    paths:
      - .github/workflows/native-qc-one-shot.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Public endpoint access and bounded independent data slice
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode
          from urllib.error import HTTPError
          from datetime import datetime,timezone
          from pathlib import Path
          import csv,io,json,hashlib,os
          dest=Path(os.environ['RUNNER_TEMP'])/'tidal-native-probe'
          dest.mkdir()
          summary={'checked_utc':datetime.now(timezone.utc).isoformat(),
                   'classification':'PUBLIC_SOURCE_AVAILABILITY_AND_ARITHMETIC_SAMPLE_ONLY',
                   'source_qc_not_established':True}
          for name,url in {
            'raw_native_archive':'https://data.fundyforce.ca/forceCloud/index.php/s/TAEz9gwARDDXCTD?path=%2F',
            'adcp_metadata_archive':'https://data.fundyforce.ca/forceCloud/index.php/s/85etc2wCZt7K9FA'
          }.items():
              try:
                  with urlopen(Request(url,method='HEAD',headers={'User-Agent':'TidalTurbine-research/1.0'}),timeout=12) as resp:
                      summary[name]={'http_status':resp.status,'content_type':resp.headers.get('Content-Type'),
                          'content_length_header':resp.headers.get('Content-Length'),'final_url':resp.url}
              except HTTPError as ex:
                  summary[name]={'http_status':ex.code,'error':'Public archive endpoint declined HEAD; no native measurements obtained'}
              except Exception as ex:
                  summary[name]={'error_type':type(ex).__name__,'no_native_data_acquired':True}
          fields=['waterbody','station','deployment_id','time','latitude','longitude','sea_water_speed',
                  'sea_water_to_direction','sea_surface_wave_significant_height','sensor_depth_below_surface',
                  'grossrange_flag_sea_water_speed','grossrange_flag_sea_water_to_direction',
                  'grossrange_flag_sea_surface_wave_significant_height','grossrange_flag_sensor_depth_below_surface']
          url='https://cioosatlantic.ca/erddap/tabledap/7iig-p4yk.csv0?'+','.join(fields)+'&'+urlencode({
               'time>':'2021-09-22T00:00:00Z','time<':'2021-09-24T00:00:00Z'})
          summary['independent_source_url']=url
          try:
              with urlopen(Request(url,headers={'User-Agent':'TidalTurbine-research/1.0'}),timeout=45) as resp:
                  payload=resp.read(3_000_001)
                  if len(payload)>3_000_000:raise ValueError('bounded sample exceeded 3 MB')
              data=payload.decode('utf8-sig')
              rows=list(csv.DictReader(io.StringIO(data)))
              if not rows: raise ValueError('No measurements returned; preserve access diagnostic')
              if any(k not in rows[0] for k in fields):raise ValueError('Missing requested dataset field')
              sha=hashlib.sha256(payload).hexdigest()
              (dest/'digby_wave_sample.csv').write_bytes(payload)
              summary['cmar_digby']={'status':'SOURCE_SLICE_ACQUIRED_NUMERICAL_QA_PENDING',
                'rows':len(rows),'sha256':sha,'size_bytes':len(payload),
                'start_utc':min(x['time'] for x in rows),'end_utc':max(x['time'] for x in rows),
                'stations':sorted(set(x['station'] for x in rows)),
                'qc_speed_flags':sorted(set(x['grossrange_flag_sea_water_speed'] for x in rows))}
          except HTTPError as ex:
              summary['cmar_digby']={'status':'NOT_ACQUIRED','http_status':ex.code,'response_preview':ex.read(200).decode('utf8','replace')}
          except Exception as ex:
              summary['cmar_digby']={'status':'NOT_ACQUIRED','exception':str(ex)[:250],'type':type(ex).__name__}
          (dest/'probe.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('PROBE',json.dumps(summary,sort_keys=True))
          PY
      - name: Preserve bounded observation and discovery result outside Git
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidal-public-qc-discovery-cmar-slice
          path: ${{ runner.temp }}/tidal-native-probe/
          retention-days: 7
          if-no-files-found: warn
