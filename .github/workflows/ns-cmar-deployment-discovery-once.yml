name: One-time Nova Scotia public ADCP deployment metadata discovery
on:
  push:
    branches: ['research/rm2-raw-six-trials-20261020']
    paths: ['.github/workflows/ns-cmar-deployment-discovery-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire official public deployment metadata only
        run: python scripts/inspect_ns_adcp_deployments.py --acquire --out data/local/ns-adcp-discovery
      - name: Archive strictly limited official metadata and location-level discovery
        uses: actions/upload-artifact@v4
        with:
          name: cmar-official-deployment-metadata-source
          path: data/local/ns-adcp-discovery/
          if-no-files-found: error
          retention-days: 2
