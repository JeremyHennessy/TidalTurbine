name: One-time verify original UNH RM2 cross-speed processed files
on:
  push:
    branches: ['research/rm2-cross-speed-evidence-20261020']
    paths: ['.github/workflows/rm2-cross-speed-source-one-shot.yml']
permissions:
  contents: read
jobs:
  source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin all 10 upstream Git blob hashes and selected coefficients
        run: python scripts/rm2_cross_speed.py --verify-upstream --check
