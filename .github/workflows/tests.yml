name: Deterministic research checks
on:
  push:
    branches: [main, 'research/**', 'ui/**']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate evidence catalogue
        run: python scripts/check_catalogue.py
      - name: Validate mechanism, claim and observation provenance
        run: python scripts/check_mechanisms.py
      - name: Reproduce measured RM2 processed-data benchmark
        run: |
          python scripts/reproduce_rm2.py
          git diff --exit-code -- reports/RM2-OBS-001.json
      - name: Reproduce RM2 observed mean power-drag operating point analysis
        run: |
          python scripts/rm2_operating_points.py
          git diff --exit-code -- reports/RM2-TRADEOFF-001.json
      - name: Check source-pinned RM2 cross-speed power and mean-drag reproducibility
        run: python scripts/rm2_cross_speed.py --check
      - name: Reproduce published RM1 axial lab table and RM2 variability
        run: |
          python scripts/reproduce_rm1.py
          python scripts/rm2_variability.py
          git diff --exit-code -- reports/RM1-OBS-001.json reports/RM2-VARIABILITY-001.json
      - name: Validate unranked experimental prototype comparison
        run: python scripts/check_prototypes.py
      - name: Validate ocean-source registry
        run: python scripts/check_ocean_catalogue.py
      - name: Build Pages research app
        run: python scripts/build_site.py --out dist
      - name: Temporarily archive source-exact fourteen-design site for visual QA
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: tidallab-14-design-artwork-browser-qa
          path: dist/
          if-no-files-found: error
          retention-days: 1
      - name: Check browser JavaScript syntax
        run: node --check site/app.js
      - name: Smoke test TidalLab startup and observed experiment controls (Node)
        run: node tests/ui_smoke.cjs
      - name: Validate fail-closed tidal test-site and physical experiment readiness
        run: python scripts/check_validation_readiness.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Re-run synthetic screening experiment
        run: python -m tidal_screen.cli --config configs/synthetic_screen.json --out reports/local-ci.json
