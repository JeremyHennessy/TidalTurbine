name: One-shot public FORCE native archive reachability probe
on:
  push:
    branches: ['research/native-site-load-gates-20261020-b']
    paths: ['.github/workflows/force-native-access-one-shot.yml']
permissions:
  contents: read
jobs:
  bounded-public-get:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe existing public archive and metadata share with read-only bounded GET
        run: python scripts/probe_force_native_access.py --probe
