name: One-shot publish independently checked RM2 derived mechanical report to research branch
on:
  push:
    branches: ['research/rm2-raw-six-trials-20261020']
    paths: ['.github/workflows/rm2-raw-report-publish-once.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish-derived-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download trusted exact run-derived JSON only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39530354942 --repo JeremyHennessy/TidalTurbine -n rm2-six-raw-NI-descriptive-reduction --dir /tmp/rm2-derived
      - name: Reconcile report with source manifest and scientific gate
        run: |
          cp /tmp/rm2-derived/RM2-RAW-LOADS-001.json reports/RM2-RAW-LOADS-001.json
          python scripts/rm2_raw_loads.py --check
          python scripts/check_validation_readiness.py
      - name: Commit derived JSON only to isolated research branch
        run: |
          git config user.name "tidal-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/RM2-RAW-LOADS-001.json
          git diff --cached --quiet && { echo "No new report"; exit 0; }
          git commit -m "Archive checksum-pinned original NI rig force and torque descriptive reductions"
          git push origin HEAD:refs/heads/research/rm2-raw-six-trials-20261020
