name: One-shot RM2 raw figshare endpoint check
on:
  push:
    branches: ['research/rm2-raw-six-trials-20261020']
    paths: ['.github/workflows/rm2-raw-probe-once.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe published raw metadata and NI h5
        run: python scripts/probe_rm2_raw_reachability.py --probe
