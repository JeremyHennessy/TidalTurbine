name: One-shot reduce six source-pinned original RM2 2kHz NI mechanical trials
on:
  push:
    branches: ['research/rm2-raw-six-trials-20261020']
    paths: ['.github/workflows/rm2-raw-reduce-once.yml']
permissions:
  contents: read
jobs:
  reduce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional source scientific format requirements
        run: pip install -r requirements-ocean.txt
      - name: Reacquire six known raw NI+metadata byte-pinned public sources
        run: python scripts/inspect_rm2_raw.py --fetch --out data/local/rm2_six_raw
      - name: Reduce calibrated-in-source rig force, shaft torque and rotor phase into descriptive report
        run: python scripts/rm2_raw_loads.py --analyze-dir data/local/rm2_six_raw --out data/local/rm2_derived/RM2-RAW-LOADS-001.json
      - name: Archive only derived compact source-verified analysis
        uses: actions/upload-artifact@v4
        with:
          name: rm2-six-raw-NI-descriptive-reduction
          path: data/local/rm2_derived/RM2-RAW-LOADS-001.json
          if-no-files-found: error
          retention-days: 2
